plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseKeystorePath = System.getenv("NAMECARD_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("NAMECARD_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NAMECARD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NAMECARD_KEY_PASSWORD")
def releaseSigningValues = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def releaseSigningConfigured = releaseSigningValues.every { it != null && !it.isBlank() }

if (releaseSigningValues.any { it != null && !it.isBlank() } && !releaseSigningConfigured) {
    throw new GradleException("Release signing requires all NAMECARD_KEYSTORE_* and NAMECARD_KEY_* variables")
}

android {
    namespace = "jp.namecard.nfctest"
    compileSdk = 35

    defaultConfig {
        applicationId = "work.tokumaru.namecard"
        minSdk = 26
        targetSdk = 35
        versionCode = (System.getenv("NAMECARD_VERSION_CODE") ?: "17").toInteger()
        versionName = System.getenv("NAMECARD_VERSION_NAME") ?: "0.17"
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose = true }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.08.01")
    implementation composeBom
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    testImplementation "junit:junit:4.13.2"
}
