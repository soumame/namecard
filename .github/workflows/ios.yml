name: iOS

on:
  pull_request:
    paths: ["client/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["client/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Liquid Glass APIs require the iOS 26 SDK; this image defaults to Xcode 26.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify project and core
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s client/ios/tools -p 'test_*.py' -v
          python3 client/ios/tools/generate_project.py --check
          swift test --package-path client/ios/NamecardCore
      - name: Build release without signing
        run: >-
          xcodebuild -project client/ios/Namecard.xcodeproj -scheme Namecard
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/namecard-build" CODE_SIGNING_ALLOWED=NO build
      - name: Verify App Store build channel
        run: >-
          python3 client/ios/tools/check_distribution_build.py
          --app "$RUNNER_TEMP/namecard-build/Build/Products/Release-iphonesimulator/Namecard.app"
          --channel app-store
      - name: Build TestFlight beta without signing
        run: >-
          xcodebuild -project client/ios/Namecard.xcodeproj -scheme 'Namecard Beta'
          -configuration Beta -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/namecard-build" CODE_SIGNING_ALLOWED=NO build
      - name: Verify TestFlight build channel
        run: >-
          python3 client/ios/tools/check_distribution_build.py
          --app "$RUNNER_TEMP/namecard-build/Build/Products/Beta-iphonesimulator/Namecard.app"
          --channel beta
      - name: Build hardware validation configuration
        run: >-
          xcodebuild -project client/ios/Namecard.xcodeproj -scheme 'Namecard Hardware'
          -configuration HardwareTest -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/namecard-build" CODE_SIGNING_ALLOWED=NO build
      - name: Select an installed iPhone simulator
        run: python3 client/ios/tools/select_simulator.py >> "$GITHUB_ENV"
      - name: Run app and UI tests
        run: >-
          xcodebuild -project client/ios/Namecard.xcodeproj -scheme Namecard
          -destination "platform=iOS Simulator,id=$NAMECARD_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/namecard-build"
          -resultBundlePath "$RUNNER_TEMP/NamecardTests.xcresult"
          CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO test
      - name: Run beta app and UI tests
        run: >-
          xcodebuild -project client/ios/Namecard.xcodeproj -scheme 'Namecard Beta' -configuration Beta
          -destination "platform=iOS Simulator,id=$NAMECARD_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/namecard-beta-tests"
          -resultBundlePath "$RUNNER_TEMP/NamecardBetaTests.xcresult"
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/NamecardTests.xcresult
            ${{ runner.temp }}/NamecardBetaTests.xcresult
          if-no-files-found: ignore
